<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04050a;
    --panel: rgba(10, 12, 20, 0.86);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e9e7e2;
    --muted: #8b8f9a;
    --accent: #d4a843;
    --accent-soft: rgba(212, 168, 67, 0.14);
    --free: #5fd39a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── Starfield ───────────────────────────────────────────────────── */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  #starfield canvas { display: block; }

  /* ── Graph ───────────────────────────────────────────────────────── */
  #graph-container {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ── Header ──────────────────────────────────────────────────────── */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 26px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(4,5,10,0.85), transparent);
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .stats {
    display: flex;
    gap: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .stat-value { color: var(--accent); }
  .brain-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 11px;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .brain-chip #brain-label { color: var(--accent); }
  #brain-free {
    color: var(--free);
    border: 1px solid rgba(95, 211, 154, 0.34);
    background: rgba(95, 211, 154, 0.08);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 0.56rem;
    letter-spacing: 0.1em;
  }

  /* ── Legend ──────────────────────────────────────────────────────── */
  #legend {
    position: fixed;
    left: 26px; bottom: 156px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .legend-color {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex: none;
  }

  /* ── Side panel ──────────────────────────────────────────────────── */
  #panel {
    position: fixed;
    top: 0; right: 0;
    z-index: 6;
    width: 380px;
    max-width: 88vw;
    height: 100%;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border-left: 1px solid var(--border);
    transform: translateX(102%);
    transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  .panel-header {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .panel-title {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .panel-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    flex: none;
  }
  .panel-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .panel-content {
    padding: 20px 22px 30px;
    overflow-y: auto;
    font-size: 0.88rem;
    line-height: 1.65;
    color: #cfd2da;
  }
  .note-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(212,168,67,0.3);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .note-excerpt { color: #b9bdc7; }
  .note-links { margin-top: 22px; }
  .note-links-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    margin-bottom: 9px;
  }
  .link-item {
    display: block;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.8rem;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .link-item:hover { color: #f3d089; }

  /* ── Chat bar ────────────────────────────────────────────────────── */
  #chat-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 7;
    padding: 18px 26px 22px;
    background: linear-gradient(to top, rgba(4,5,10,0.96) 40%, transparent);
  }
  .chat-inner {
    max-width: 900px;
    margin: 0 auto;
  }
  .chat-answer {
    margin-bottom: 12px;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(12, 14, 22, 0.8);
    font-size: 0.87rem;
    line-height: 1.6;
    color: #d7dae2;
    min-height: 0;
    display: none;
  }
  .chat-answer.visible { display: block; }
  .chat-answer .src-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .chat-answer .src-tags { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chat-answer .src-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: var(--accent);
    border: 1px solid rgba(212,168,67,0.3);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chat-answer.error { border-color: rgba(231,111,81,0.45); color: #f0a08c; }

  /* ── Boot greeting ─────────────────────────────────────────────────── */
  #boot-greeting {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    color: #c6c9d2;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    pointer-events: none;
  }
  #boot-greeting.show { opacity: 1; transform: translateY(0); }
  #boot-greeting.fade { opacity: 0; transform: translateY(-5px); }

  .chat-row { display: flex; gap: 10px; }
  #chat-input {
    flex: 1;
    background: rgba(12, 14, 22, 0.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #chat-input:focus { border-color: rgba(212,168,67,0.5); }
  #chat-input::placeholder { color: #5c606b; }
  #chat-send {
    background: var(--accent);
    color: #14100a;
    border: none;
    border-radius: 10px;
    padding: 13px 26px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  #chat-send:hover { opacity: 0.88; }
  #chat-send:active { transform: translateY(1px); }
  #chat-send:disabled { opacity: 0.4; cursor: default; }
  .chat-hint {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: #4d515c;
    text-align: center;
  }

  /* ── Voice ───────────────────────────────────────────────────────── */
  #mic-btn {
    width: 46px; height: 46px;
    flex: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(12, 14, 22, 0.9);
    color: var(--muted);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  #mic-btn:hover:not(:disabled) { color: var(--text); border-color: rgba(212,168,67,0.4); }
  #mic-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #mic-btn.listening {
    color: #14100a;
    background: #e76f51;
    border-color: #e76f51;
    animation: micPulse 1.3s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(231, 111, 81, 0.45); }
    50% { box-shadow: 0 0 0 9px rgba(231, 111, 81, 0); }
  }
  #voice-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 9px 0 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #4d515c;
  }
  #voice-status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4d515c;
    flex: none;
  }
  #voice-status.listening { color: #e76f51; }
  #voice-status.listening::before { background: #e76f51; animation: statusPulse 1.1s ease-in-out infinite; }
  #voice-status.thinking { color: var(--accent); }
  #voice-status.thinking::before { background: var(--accent); animation: statusPulse 1.1s ease-in-out infinite; }
  #voice-status.speaking { color: #79c2a5; }
  #voice-status.speaking::before { background: #79c2a5; }
  #voice-status.error { color: #e76f51; }
  #voice-status.error::before { background: #e76f51; }
  @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

  /* ── Loading ─────────────────────────────────────────────────────── */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    transition: opacity 0.6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px;
    border: 2px solid rgba(212,168,67,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.85s linear infinite;
  }
  .loading-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #controls {
    position: fixed;
    right: 26px; bottom: 156px;
    z-index: 5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    color: #4d515c;
    text-align: right;
    line-height: 1.9;
    pointer-events: none;
  }

  @media (max-width: 720px) {
    #legend, #controls { display: none; }
    #panel { width: 100%; }
    #header { padding: 14px 16px; }
    #chat-bar { padding: 14px 16px 18px; }
  }
</style>
</head>
<body>

<div id="starfield"></div>
<div id="graph-container"></div>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Charting the galaxy…</div>
</div>

<header id="header">
  <div class="logo">Stellar <span>Knowledge Galaxy</span></div>
  <div class="stats">
    <div><span class="stat-value" id="stat-nodes">0</span> notes</div>
    <div><span class="stat-value" id="stat-links">0</span> connections</div>
    <div class="brain-chip" id="brain-chip" title="The brain in use right now">BRAIN<span id="brain-label">…</span><span id="brain-free" hidden>FREE</span></div>
  </div>
</header>

<nav id="legend"></nav>

<aside id="panel" aria-label="Note details">
  <div class="panel-header">
    <h2 class="panel-title" id="panel-title">Select a star</h2>
    <button class="panel-close" id="panel-close" aria-label="Close panel">✕</button>
  </div>
  <div class="panel-content" id="panel-content">
    <div style="color:var(--muted)">Click any node to read it.</div>
  </div>
</aside>

<div id="controls">
  click node → focus<br>
  drag → rotate<br>
  scroll → zoom<br>
  esc → close
</div>

<div id="chat-bar">
  <div class="chat-inner">
    <div class="chat-answer" id="chat-answer" aria-live="polite"></div>
    <div id="boot-greeting"></div>
    <div class="chat-row">
      <button id="mic-btn" type="button" aria-label="Speak your question" aria-pressed="false" title="Speak your question">🎙</button>
      <input type="text" id="chat-input" placeholder="Ask the galaxy…" autocomplete="off" spellcheck="false">
      <button id="chat-send">Ask</button>
    </div>
    <div id="voice-status" role="status" aria-live="polite">Ready</div>
    <div class="chat-hint">Answers come only from the notes above · click a cited note to jump to it</div>
  </div>
</div>

<!-- Three.js must be present before the 3d-force-graph UMD bundle. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
<!-- Defines `const GRAPH` for the inline script below. -->
<script src="graph-data.js"></script>

<script>
(function () {
  'use strict';

  const GROUP_COLORS = [
    '#d4a843', '#6b4e8c', '#3a7bc8', '#2a9d8f',
    '#e76f51', '#8abd56', '#f4a261', '#9b5de5'
  ];
  const IDLE_SPEED = 0.00035;
  const CAMERA_DISTANCE = 300;

  // How many sources an answer may draw on before the galaxy stops pretending
  // it came from one place. Up to three: fly to the top source and light it.
  // Four or more: light the whole cluster and stay exactly where we are.
  const FOCUS_SOURCES_MAX = 3;

  // ── Voice ─────────────────────────────────────────────────────────
  // The one and only place the speech finish window is defined. A pause
  // longer than this ends a thought; a shorter one keeps the phrase open,
  // so a mid-sentence pause never ships half a sentence.
  const FINISH_MS = 900;

  // Short interrupt words skip the buffer and fire the moment they land.
  const INTERRUPT_WORDS = [
    'stop', 'wait', 'hold on', 'hold up', 'never mind', 'nevermind',
    'cancel', 'shut up', 'scrap that'
  ];

  const VOICE_LANG = 'en-GB';

  const container = document.getElementById('graph-container');
  const loadingEl = document.getElementById('loading');
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panel-title');
  const panelContent = document.getElementById('panel-content');
  const panelClose = document.getElementById('panel-close');
  const legendEl = document.getElementById('legend');
  const statNodes = document.getElementById('stat-nodes');
  const statLinks = document.getElementById('stat-links');

  const chatInput = document.getElementById('chat-input');
  const chatSend = document.getElementById('chat-send');
  const chatAnswer = document.getElementById('chat-answer');
  const micBtn = document.getElementById('mic-btn');
  const voiceStatus = document.getElementById('voice-status');

  let graph = null;
  let selected = null;
  let sessionId = null;
  const groupColorMap = new Map();

  // ── Utilities ──────────────────────────────────────────────────────
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function colorFor(group) {
    if (!groupColorMap.has(group)) {
      const i = groupColorMap.size % GROUP_COLORS.length;
      groupColorMap.set(group, GROUP_COLORS[i]);
    }
    return groupColorMap.get(group);
  }

  // ── Starfield ──────────────────────────────────────────────────────
  function initStarfield() {
    const canvas = document.createElement('canvas');
    document.getElementById('starfield').appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      seed();
    }
    function seed() {
      stars = [];
      const count = Math.min(320, Math.floor(window.innerWidth * window.innerHeight / 2600));
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.4 + 0.3,
          a: Math.random() * 0.6 + 0.2,
          speed: Math.random() * 0.12 + 0.02,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    function frame() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const s of stars) {
        s.phase += s.speed * 0.012;
        const twinkle = Math.sin(s.phase) * 0.3 + 0.7;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(232,230,225,' + (s.a * twinkle).toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    window.addEventListener('resize', resize);
    resize();
    frame();
  }

  // ── Node meshes ────────────────────────────────────────────────────
  function buildNodeObject(node) {
    const color = colorFor(node.group);
    const group = new THREE.Group();

    // Soft glow halo
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = glowCanvas.height = 64;
    const gctx = glowCanvas.getContext('2d');
    const gradient = gctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, color);
    gradient.addColorStop(0.4, color + '80');
    gradient.addColorStop(1, 'transparent');
    gctx.fillStyle = gradient;
    gctx.fillRect(0, 0, 64, 64);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glowCanvas),
      transparent: true,
      depthWrite: false,
      opacity: 0.9
    }));
    sprite.scale.set(14, 14, 1);
    sprite.renderOrder = 10;
    group.add(sprite);

    // Glowing core
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(3.6, 16, 16),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(color),
        transparent: true,
        opacity: 1,
        depthWrite: true
      })
    );
    sphere.renderOrder = 5;
    group.add(sphere);

    // Orbital ring
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(5.2, 7.2, 32),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(color),
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.renderOrder = 8;
    group.add(ring);

    node._object = group;
    node._sphere = sphere;
    node._ring = ring;
    return group;
  }

  // ── Graph ──────────────────────────────────────────────────────────
  function initGraph() {
    const data = GRAPH;
    statNodes.textContent = data.nodes.length;
    statLinks.textContent = data.links.length;

    data.nodes.forEach(n => colorFor(n.group));
    buildLegend();

    graph = ForceGraph3D()(container)
      .graphData(data)
      .nodeId('id')
      .nodeLabel('label')
      .nodeVal(5)
      .nodeColor(n => colorFor(n.group))
      .nodeThreeObject(buildNodeObject)
      .nodeThreeObjectExtend(true)
      .linkColor(() => 'rgba(212,168,67,0.16)')
      .linkOpacity(0.45)
      .linkWidth(0.6)
      .linkDirectionalArrowLength(0)
      .backgroundColor('#04050a')
      .showNavInfo(false)
      .onNodeClick(onNodeClick)
      .onBackgroundClick(closePanel)
      .enableNodeDrag(false)
      .cooldownTicks(300)
      .warmupTicks(100);

    graph.cameraPosition({ x: 0, y: 0, z: CAMERA_DISTANCE }, { x: 0, y: 0, z: 0 }, 0);
    const controls = graph.controls();
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.32;
    controls.zoomSpeed = 0.8;
    controls.panSpeed = 0.5;
    controls.minDistance = 50;
    controls.maxDistance = 900;

    startIdleRotation();

    loadingEl.classList.add('hidden');
    setTimeout(() => loadingEl.remove(), 700);
  }

  function buildLegend() {
    legendEl.innerHTML = '';
    Array.from(groupColorMap.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .forEach(([group, color]) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = '<span class="legend-color" style="background:' + color +
          '; box-shadow:0 0 9px ' + color + '"></span>' + escapeHtml(group);
        legendEl.appendChild(item);
      });
  }

  function startIdleRotation() {
    function tick() {
      if (graph) {
        const controls = graph.controls();
        if (!controls.autoRotate) {
          controls.autoRotate = true;
          controls.autoRotateSpeed = IDLE_SPEED;
        }
        pulseNodes();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function pulseNodes() {
    if (!GRAPH || !GRAPH.nodes) return;
    const t = Date.now() * 0.001;
    for (const node of GRAPH.nodes) {
      if (node._sphere && node !== selected) {
        node._sphere.scale.setScalar(1 + Math.sin(t * 1.4 + node.id * 0.5) * 0.08);
        if (node._ring) {
          node._ring.rotation.z += 0.002;
          node._ring.material.opacity = 0.2 + Math.sin(t * 2 + node.id) * 0.1;
        }
      }
    }
  }

  // ── Selection ──────────────────────────────────────────────────────
  function neighbourIds(node) {
    const ids = new Set();
    for (const link of GRAPH.links) {
      const s = typeof link.source === 'object' ? link.source.id : link.source;
      const t = typeof link.target === 'object' ? link.target.id : link.target;
      if (s === node.id) ids.add(t);
      if (t === node.id) ids.add(s);
    }
    return ids;
  }

  function onNodeClick(node) {
    if (!node) return;
    selected = node;
    flyTo(node);
    highlight(node);
    openPanel(node);
  }

  function highlight(node) {
    const near = neighbourIds(node);
    for (const n of GRAPH.nodes) {
      if (!n._sphere) continue;
      if (n.id === node.id) {
        n._sphere.material.color.setHex(0xffffff);
        n._sphere.scale.setScalar(2);
        n._ring.material.color.setHex(0xffffff);
        n._ring.material.opacity = 0.85;
        n._ring.scale.setScalar(1.6);
      } else if (near.has(n.id)) {
        n._sphere.material.color.setHex(0xffdd88);
        n._sphere.scale.setScalar(1.45);
        n._ring.material.opacity = 0.55;
      } else {
        n._sphere.material.color.setHex(new THREE.Color(colorFor(n.group)).getHex());
        n._sphere.scale.setScalar(1);
        n._ring.material.opacity = 0.04;
      }
    }
    graph.linkOpacity(link => {
      const s = typeof link.source === 'object' ? link.source.id : link.source;
      const t = typeof link.target === 'object' ? link.target.id : link.target;
      return (s === node.id || t === node.id) ? 0.85 : 0.04;
    });
    graph.linkWidth(link => {
      const s = typeof link.source === 'object' ? link.source.id : link.source;
      const t = typeof link.target === 'object' ? link.target.id : link.target;
      return (s === node.id || t === node.id) ? 2 : 0.3;
    });
  }

  // Light a whole set of sources at once. Used when an answer came from
  // several notes and singling out one of them would be a lie.
  function highlightCluster(ids) {
    const set = new Set(ids);
    selected = null;
    for (const n of GRAPH.nodes) {
      if (!n._sphere) continue;
      if (set.has(n.id)) {
        n._sphere.material.color.setHex(0xfff0c0);
        n._sphere.scale.setScalar(1.55);
        n._ring.material.color.setHex(0xfff0c0);
        n._ring.material.opacity = 0.75;
        n._ring.scale.setScalar(1.35);
      } else {
        n._sphere.material.color.setHex(new THREE.Color(colorFor(n.group)).getHex());
        n._sphere.scale.setScalar(0.75);
        n._ring.material.color.setHex(new THREE.Color(colorFor(n.group)).getHex());
        n._ring.material.opacity = 0.03;
        n._ring.scale.setScalar(1);
      }
    }
    const ends = link => {
      const s = typeof link.source === 'object' ? link.source.id : link.source;
      const t = typeof link.target === 'object' ? link.target.id : link.target;
      return [s, t];
    };
    graph.linkOpacity(link => {
      const e = ends(link);
      if (set.has(e[0]) && set.has(e[1])) return 0.95;
      if (set.has(e[0]) || set.has(e[1])) return 0.45;
      return 0.03;
    });
    graph.linkWidth(link => {
      const e = ends(link);
      if (set.has(e[0]) && set.has(e[1])) return 2.4;
      if (set.has(e[0]) || set.has(e[1])) return 1.1;
      return 0.3;
    });
  }

  function clearHighlight() {
    selected = null;
    for (const n of GRAPH.nodes) {
      if (!n._sphere) continue;
      n._sphere.material.color.setHex(new THREE.Color(colorFor(n.group)).getHex());
      n._sphere.scale.setScalar(1);
      n._ring.material.color.setHex(new THREE.Color(colorFor(n.group)).getHex());
      n._ring.material.opacity = 0.3;
      n._ring.scale.setScalar(1);
    }
    graph.linkOpacity(0.45);
    graph.linkWidth(0.6);
    graph.linkColor(() => 'rgba(212,168,67,0.16)');
  }

  function flyTo(node) {
    const pos = node._object.getWorldPosition(new THREE.Vector3());
    graph.cameraPosition(
      { x: pos.x, y: pos.y + 32, z: pos.z + 130 },
      { x: pos.x, y: pos.y, z: pos.z },
      1400
    );
  }

  // ── Provenance ─────────────────────────────────────────────────────
  // Show where an answer came from. The decision to move the camera is made
  // from the answer's sources, never from the fact that something was said.
  function sourceNodeIds(data) {
    if (!data || data.intent !== 'notes' || !Array.isArray(data.nodes)) return [];
    return data.nodes.filter(function (i) {
      return Number.isInteger(i) && i >= 0 && i < GRAPH.nodes.length;
    });
  }

  function revealSources(ids) {
    if (!ids.length) return;              // not about the notes: hold still
    if (ids.length <= FOCUS_SOURCES_MAX) {
      // One place the answer came from: go there, light it and its neighbours
      // and open it, so the note is on screen while the answer is spoken.
      onNodeClick(GRAPH.nodes[ids[0]]);
    } else {
      // Many places: light the whole cluster and stay put. Flying to one
      // arbitrary note out of six would be a lie about where it came from.
      // And no single note may sit in the panel pretending to be the source
      // - the panel is closed, because there is no one note to show.
      closePanel();
      highlightCluster(ids);
    }
  }

  // ── Panel ──────────────────────────────────────────────────────────
  function openPanel(node) {
    panelTitle.textContent = node.label;
    panel.classList.add('open');

    const neighbours = GRAPH.nodes.filter(n => neighbourIds(node).has(n.id));
    panelContent.innerHTML =
      '<div class="note-tag">' + escapeHtml(node.group) + '</div>' +
      '<div class="note-excerpt">' + escapeHtml(node.excerpt) + '</div>' +
      (neighbours.length
        ? '<div class="note-links"><div class="note-links-title">Connected notes (' +
            neighbours.length + ')</div>' +
            neighbours.map(n =>
              '<a class="link-item" href="#" data-id="' + n.id + '">' +
              escapeHtml(n.label) + '</a>').join('') +
          '</div>'
        : '');

    panelContent.querySelectorAll('.link-item').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        const target = GRAPH.nodes.find(n => n.id === parseInt(el.dataset.id, 10));
        if (target) { onNodeClick(target); }
      });
    });
  }

  function closePanel() {
    panel.classList.remove('open');
    clearHighlight();
  }
  panelClose.addEventListener('click', closePanel);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
  });

  // ── Voice: speaking ───────────────────────────────────────────────
  // Every word the assistant says leaves this file through speakText(), and
  // speakText() is the only place that ever calls speechSynthesis.speak().
  // That is where ?mute=1 is enforced, so nothing can talk around it.
  const synth = window.speechSynthesis || null;

  const STATUS_LABELS = {
    idle: 'Ready',
    listening: 'Listening…',
    thinking: 'Thinking…',
    speaking: 'Speaking…'
  };

  let speechUnlocked = false;
  let speechQueue = [];
  let preferredVoice = null;
  let speakKeepAlive = null;

  function isMuted() {
    try {
      const value = new URLSearchParams(window.location.search).get('mute');
      return value === '1' || value === 'true';
    } catch (e) {
      return false;
    }
  }

  function idleLabel() {
    if (isMuted()) return 'Ready · muted';
    if (!synth) return 'Ready · no speech output';
    return STATUS_LABELS.idle;
  }

  function setStatus(state, label) {
    if (!voiceStatus) return;
    voiceStatus.className = state || 'idle';
    voiceStatus.textContent = label ||
      (state === 'idle' ? idleLabel() : (STATUS_LABELS[state] || state));
  }

  // A British English voice when the system has one, otherwise any English.
  function pickVoice() {
    if (!synth) return null;
    const voices = synth.getVoices() || [];
    if (!voices.length) return null;
    const gb = voices.filter(v => v.lang && v.lang.toLowerCase().indexOf('en-gb') === 0);
    return gb.find(v => /google uk english/i.test(v.name))
      || gb.find(v => /(natural|premium|enhanced|online)/i.test(v.name))
      || gb[0]
      || voices.find(v => /^en/i.test(v.lang))
      || null;
  }

  function stopSpeakKeepAlive() {
    if (speakKeepAlive) { clearInterval(speakKeepAlive); speakKeepAlive = null; }
  }

  // Some builds park the speech engine after a short silence; a periodic
  // resume() keeps a long answer from being cut off mid-sentence.
  function startSpeakKeepAlive() {
    stopSpeakKeepAlive();
    speakKeepAlive = setInterval(function () {
      try { synth.resume(); } catch (e) {}
    }, 7000);
  }

  function speakText(text, options) {
    if (isMuted()) { setStatus('idle'); return false; }   // ← the mute gate
    if (!synth || !text) { setStatus('idle'); return false; }
    const opts = options || {};

    // The browser will not talk until the user has interacted with the page.
    if (!speechUnlocked) {
      if (!opts.prime) speechQueue.push({ text: text, options: opts });
      setStatus('idle');
      return false;
    }

    try {
      if (opts.cancel !== false) synth.cancel();
      synth.resume();
      const utterance = new SpeechSynthesisUtterance(String(text));
      const voice = preferredVoice || pickVoice();
      if (voice) {
        // Some engines reject a voice from a stale list - never let that kill
        // the whole line, fall back to the language alone.
        try { utterance.voice = voice; } catch (e) {}
        utterance.lang = voice.lang || VOICE_LANG;
      } else {
        utterance.lang = VOICE_LANG;
      }
      utterance.rate = opts.rate || 1;
      utterance.pitch = opts.pitch || 1;
      if (opts.volume !== undefined) utterance.volume = opts.volume;
      if (!opts.prime) {
        utterance.onstart = function () {
          const spoken = utterance.voice ? utterance.voice.name : null;
          setStatus('speaking', spoken ? STATUS_LABELS.speaking + ' · ' + spoken : STATUS_LABELS.speaking);
        };
        const done = function () { setStatus('idle'); stopSpeakKeepAlive(); };
        utterance.onend = done;
        utterance.onerror = done;
      }
      synth.speak(utterance);
      if (!opts.prime) startSpeakKeepAlive();
      return true;
    } catch (e) {
      setStatus('error', 'Speech failed');
      stopSpeakKeepAlive();
      return false;
    }
  }

  function cancelSpeech() {
    if (!synth) return;
    stopSpeakKeepAlive();
    try { synth.cancel(); } catch (e) {}
  }

  // Browsers keep the audio engine locked until the page has been touched,
  // so the first gesture primes it with an inaudible line. Nothing is ever
  // spoken before that, and the first real answer is never swallowed.
  function unlockSpeech() {
    if (speechUnlocked) return;
    speechUnlocked = true;
    speakText(' ', { volume: 0, prime: true, cancel: false });
    const queued = speechQueue.splice(0, speechQueue.length);
    queued.forEach(function (item) {
      speakText(item.text, Object.assign({}, item.options, { cancel: false }));
    });
  }

  ['pointerdown', 'keydown', 'touchstart'].forEach(function (evt) {
    document.addEventListener(evt, unlockSpeech, { once: true, capture: true });
  });

  // ── Voice: listening ──────────────────────────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  let recognition = null;
  let micWanted = false;
  let voiceBuffer = '';
  let finishTimer = null;
  let recognitionRetried = false;

  function normaliseWords(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/[^\w\s']/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // "stop", "wait", "never mind" and friends jump the queue.
  function isInterrupt(text) {
    const words = normaliseWords(text);
    if (!words) return false;
    if (INTERRUPT_WORDS.indexOf(words) !== -1) return true;
    const parts = words.split(' ');
    return parts.length <= 2 && parts.every(p => INTERRUPT_WORDS.indexOf(p) !== -1);
  }

  function appendFinal(text) {
    const chunk = String(text || '').trim();
    if (!chunk) return;
    const tail = voiceBuffer.toLowerCase();
    const low = chunk.toLowerCase();
    // Chrome can repeat the last phrase when a session restarts.
    if (tail && (tail === low || tail.slice(-(low.length + 1)) === ' ' + low)) return;
    voiceBuffer = voiceBuffer ? voiceBuffer + ' ' + chunk : chunk;
  }

  function stopFinishTimer() {
    if (finishTimer) { clearTimeout(finishTimer); finishTimer = null; }
  }

  // Any speech that lands before the window closes keeps the thought open.
  function restartFinishTimer() {
    stopFinishTimer();
    finishTimer = setTimeout(function () {
      finishTimer = null;
      flushVoiceBuffer();
    }, FINISH_MS);
  }

  function flushVoiceBuffer() {
    const text = voiceBuffer.trim();
    voiceBuffer = '';
    if (!text) { if (!micWanted) setStatus('idle'); return; }
    dispatchTranscript(text, false);
  }

  function setMicActive(active) {
    if (!micBtn) return;
    micBtn.classList.toggle('listening', !!active);
    micBtn.setAttribute('aria-pressed', active ? 'true' : 'false');
    micBtn.title = active ? 'Stop listening' : 'Speak your question';
  }

  function handleRecognitionResult(event) {
    const results = event.results;
    let interim = '';
    let finalText = '';
    for (let i = event.resultIndex; i < results.length; i++) {
      const res = results[i];
      const text = res && res[0] && res[0].transcript ? res[0].transcript : '';
      if (res.isFinal) {
        if (text.trim()) finalText = finalText ? finalText + ' ' + text.trim() : text.trim();
      } else {
        interim += text;
      }
    }

    // An interrupt word never waits for the window.
    if (finalText && isInterrupt(finalText)) {
      dispatchTranscript(finalText, true);
      return;
    }

    if (finalText) appendFinal(finalText);

    // Show what is being heard right now.
    const shown = [voiceBuffer, interim.trim()].filter(Boolean).join(' ');
    if (chatInput) chatInput.value = shown;

    // More speech arrived, so the thought is not over: restart the window.
    restartFinishTimer();
  }

  function dispatchTranscript(text, interrupt) {
    stopFinishTimer();
    voiceBuffer = '';
    micWanted = false;
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    setMicActive(false);
    if (interrupt) cancelSpeech();
    if (chatInput) chatInput.value = text;
    ask(text);          // exactly the same flow as typing
  }

  function onRecognitionError(event) {
    const code = event && event.error ? event.error : 'unknown';
    // A language the recogniser does not know is not fatal - fall back.
    if ((code === 'language-not-supported' || code === 'service-not-allowed') && !recognitionRetried) {
      recognitionRetried = true;
      try {
        recognition.lang = '';
        recognition.start();
        return;
      } catch (e) {}
    }
    micWanted = false;
    stopFinishTimer();
    setMicActive(false);
    setStatus('error', code === 'not-allowed' ? 'Microphone blocked' : 'Mic error: ' + code);
  }

  function onRecognitionEnd() {
    // Chrome closes a session on its own now and then. If the mic is still
    // wanted, pick it straight back up so a pause never loses the sentence.
    if (micWanted) {
      try { recognition.start(); return; } catch (e) {}
    }
    setMicActive(false);
    if (!micWanted) setStatus('idle');
  }

  function startListening() {
    if (!SR) { setStatus('error', 'Voice input needs Chrome or Edge'); return; }
    if (!recognition) {
      recognition = new SR();
      recognition.continuous = true;       // keep the session open across pauses
      recognition.interimResults = true;
      recognition.lang = VOICE_LANG;
      recognition.onresult = handleRecognitionResult;
      recognition.onerror = onRecognitionError;
      recognition.onend = onRecognitionEnd;
    }
    micWanted = true;
    setMicActive(true);
    setStatus('listening');
    // Never transcribe the assistant talking over you.
    cancelSpeech();
    try { recognition.start(); } catch (e) {}
  }

  function stopListening() {
    micWanted = false;
    stopFinishTimer();
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    setMicActive(false);
    setStatus('idle');
  }

  if (micBtn) {
    micBtn.addEventListener('click', function () {
      unlockSpeech();
      if (micWanted) {
        if (voiceBuffer.trim()) flushVoiceBuffer();
        else stopListening();
      } else {
        startListening();
      }
    });
  }

  if (synth) {
    preferredVoice = pickVoice();
    if (typeof synth.addEventListener === 'function') {
      synth.addEventListener('voiceschanged', function () { preferredVoice = pickVoice(); });
    } else {
      synth.onvoiceschanged = function () { preferredVoice = pickVoice(); };
    }
  }

  if (!SR) {
    if (micBtn) {
      micBtn.disabled = true;
      micBtn.title = 'Voice input needs Chrome or Edge';
    }
    setStatus('error', 'Voice input needs Chrome or Edge');
  } else {
    setStatus('idle');
  }

  // ── Chat ───────────────────────────────────────────────────────────
  async function ask(question) {
    chatSend.disabled = true;
    chatInput.disabled = true;
    chatAnswer.className = 'chat-answer visible';
    chatAnswer.innerHTML = '<span style="color:var(--muted)">Thinking…</span>';
    setStatus('thinking');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, session_id: sessionId })
      });
      const data = await res.json();
      if (data.session_id) sessionId = data.session_id;
      if (data.label) setBrainChip(data.label, data.free);

      let html = '';
      if (data.error) {
        html = '<div>' + escapeHtml(data.answer || data.error) + '</div>';
        chatAnswer.className = 'chat-answer visible error';
      } else {
        if (data.nodes && data.nodes.length) {
          html += '<div class="src-note">From ' + data.nodes.length +
                  ' note' + (data.nodes.length === 1 ? '' : 's') + '</div>';
        }
        html += '<div>' + escapeHtml(data.answer) + '</div>';
        if (data.nodes && data.nodes.length) {
          html += '<div class="src-tags">' + data.nodes.map(idx => {
            const n = GRAPH.nodes[idx];
            return n ? '<span class="src-tag" data-id="' + n.id + '">' +
              escapeHtml(n.label) + '</span>' : '';
          }).join('') + '</div>';
        }
      }
      chatAnswer.innerHTML = html;

      // Prove where the answer came from - the camera moves only for real
      // questions about the notes, and it moves as the answer is spoken.
      revealSources(sourceNodeIds(data));

      // Every answer is spoken, typed or spoken-to.
      speakText(data.answer || '');

      chatAnswer.querySelectorAll('.src-tag').forEach(el => {
        el.addEventListener('click', () => {
          const target = GRAPH.nodes.find(n => n.id === parseInt(el.dataset.id, 10));
          if (target) onNodeClick(target);
        });
      });
    } catch (err) {
      chatAnswer.className = 'chat-answer visible error';
      chatAnswer.textContent = 'Could not reach the server: ' + err.message;
      speakText('Could not reach the server: ' + err.message);
    } finally {
      chatSend.disabled = false;
      chatInput.disabled = false;
      chatInput.focus();
    }
  }

  chatSend.addEventListener('click', () => {
    const q = chatInput.value.trim();
    if (!q) return;
    chatInput.value = '';
    ask(q);
  });
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const q = chatInput.value.trim();
      if (!q) return;
      chatInput.value = '';
      ask(q);
    }
  });

  // ── The brain in use ───────────────────────────────────────────────
  // A small chip in the header showing which model is thinking right now.
  // The label comes from the server, so the hyphen rule lives in one place.
  // The FREE badge says, at a glance, that this answer was not paid for.
  function setBrainChip(label, free) {
    const el = document.getElementById('brain-label');
    if (el && label) el.textContent = label;
    const badge = document.getElementById('brain-free');
    if (badge) badge.hidden = !free;
  }

  async function loadBrainChip() {
    try {
      const res = await fetch('/model');
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.label) setBrainChip(data.label, data.free);
    } catch (e) { /* the chip stays blank */ }
  }

  // ── Boot greeting ──────────────────────────────────────────────────
  // One short line when the page loads, and nothing more. The wording comes
  // from the server so the character stays in one place. It is shown, not
  // spoken: a spoken status report on every refresh gets old by the third
  // reload, and the browser will not allow audio before the first click.
  async function showBootGreeting() {
    const el = document.getElementById('boot-greeting');
    if (!el) return;
    try {
      const res = await fetch('/greeting');
      if (!res.ok) return;
      const data = await res.json();
      if (!data || !data.greeting) return;
      el.textContent = data.greeting;
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(function () {
        el.classList.add('fade');
        setTimeout(() => el.remove(), 1000);
      }, 5200);
    } catch (e) { /* no greeting is better than a broken one */ }
  }

  // ── Boot ───────────────────────────────────────────────────────────
  initStarfield();
  initGraph();
  showBootGreeting();
  loadBrainChip();
})();
</script>
</body>
</html>
